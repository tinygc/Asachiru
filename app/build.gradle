plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// local.propertiesから署名情報を読み込む
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localProperties.load(new FileInputStream(localPropertiesFile))
}

android {
    namespace 'com.tinygc.asachiru'
    compileSdk 34

    defaultConfig {
        minSdk 21
        targetSdk 34

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        asachiruRelease {
            storeFile file(localProperties['ASACHIRU_STORE_FILE'] ?: '../asachiru-release.jks')
            storePassword localProperties['ASACHIRU_STORE_PASSWORD'] ?: ''
            keyAlias localProperties['ASACHIRU_KEY_ALIAS'] ?: 'asachiru'
            keyPassword localProperties['ASACHIRU_KEY_PASSWORD'] ?: ''
        }
        feedwatchRelease {
            storeFile file(localProperties['FEEDWATCH_STORE_FILE'] ?: '../feedwatch-release.jks')
            storePassword localProperties['FEEDWATCH_STORE_PASSWORD'] ?: ''
            keyAlias localProperties['FEEDWATCH_KEY_ALIAS'] ?: 'feedwatch'
            keyPassword localProperties['FEEDWATCH_KEY_PASSWORD'] ?: ''
        }
    }

    flavorDimensions = ["app"]

    productFlavors {
        asachiru {
            dimension "app"
            applicationId "com.tinygc.asachiru"
            versionCode 1
            versionName "1.0"
            resValue "string", "app_name", "朝チル (AsaChil)"
            // Asachiru用のAdMob App ID
            manifestPlaceholders = [
                admobAppId: "ca-app-pub-4454020110016010~4810797955"
            ]
            // Asachiru用の広告ユニットID
            resValue "string", "admob_banner_ad_unit_id", "ca-app-pub-4454020110016010/3966288443"
            // Asachiru用の署名設定
            signingConfig signingConfigs.asachiruRelease
        }

        feedwatch {
            dimension "app"
            applicationId "com.tinygc.feedwatch"
            versionCode 4
            versionName "1.1.0"
            resValue "string", "app_name", "RSS FeedWatch"
            // FeedWatch用のAdMob App ID
            manifestPlaceholders = [
                admobAppId: "ca-app-pub-4454020110016010~3627678411"
            ]
            // FeedWatch用の広告ユニットID
            resValue "string", "admob_banner_ad_unit_id", "ca-app-pub-4454020110016010/7480003958"
            // FeedWatch用の署名設定
            signingConfig signingConfigs.feedwatchRelease
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }
}

dependencies {
    // AndroidX Core
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // AndroidX Leanback (for Android TV)
    implementation 'androidx.leanback:leanback:1.0.0'

    // Kotlin Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // AndroidX Lifecycle
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.6.2'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.6.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.2'

    // OkHttp
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // Gson
    implementation 'com.google.code.gson:gson:2.10.1'

    // AndroidX Media (for music playback)
    implementation 'androidx.media:media:1.7.0'

    // QR Code Generator
    implementation 'com.google.zxing:core:3.5.3'

    // Google Mobile Ads SDK
    implementation 'com.google.android.gms:play-services-ads:23.0.0'

    // Google Advertising ID
    implementation 'com.google.android.gms:play-services-ads-identifier:18.0.1'

    // Unit Test
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlin:kotlin-test:1.9.20'
    testImplementation 'org.mockito:mockito-core:5.7.0'
    testImplementation 'org.mockito.kotlin:mockito-kotlin:5.2.1'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.7.3'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    testImplementation 'org.robolectric:robolectric:4.11.1'
    testImplementation 'androidx.test:core-ktx:1.5.0'
    testImplementation 'app.cash.turbine:turbine:1.0.0'

    // Android Test
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
